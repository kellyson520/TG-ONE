name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "data/**"
      - "downloads/**"
      - "rss/**"
      - "temp/**"
      - "tests/temp/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "data/**"
      - "downloads/**"
      - "rss/**"
      - "temp/**"
      - "tests/temp/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  APP_ENV: testing
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            -x '(^|/)tests/temp(/|$)' \
            main.py manage_update.py inspect_queue.py version.py \
            ai alembic api controllers core enums filters handlers \
            listeners middlewares migrations models repositories scheduler \
            schemas scripts services ui web_admin tests

  critical-lint:
    name: Critical Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.3.0
      - name: Check syntax and undefined names
        run: |
          python -m flake8 \
            main.py manage_update.py inspect_queue.py version.py \
            ai api controllers core enums filters handlers listeners \
            middlewares migrations models repositories scheduler schemas \
            scripts services ui web_admin tests \
            --select=E9,F63,F7,F82 \
            --exclude=tests/temp \
            --count --statistics

  unit:
    name: Unit and Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - compile
      - critical-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Collect fast test suite
        run: |
          python -m pytest \
            tests/unit tests/compatibility tests/fuzz tests/security \
            -m "not stress and not slow" \
            --strict-markers \
            --collect-only -q
      - name: Run core smoke tests
        run: |
          python -m pytest \
            tests/unit/services/test_hotword_service.py \
            tests/unit/services/test_hotword_edge.py \
            tests/unit/services/test_hotword_algo.py \
            tests/unit/services/test_hotword_learn.py \
            tests/unit/middlewares/test_sender.py \
            tests/unit/services/test_smart_buffer.py \
            tests/unit/services/test_forward_log_writer.py \
            tests/unit/services/test_queue_service_cache_limits.py \
            tests/unit/services/test_ai_service.py \
            tests/unit/utils/test_unified_sender.py \
            tests/unit/utils/db/test_backup.py \
            -m "not stress and not slow" \
            --strict-markers \
            --maxfail=1 \
            --tb=short --durations=20

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - compile
      - critical-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run integration tests
        run: |
          python -m pytest \
            tests/integration/test_flood_wait.py \
            tests/integration/test_unified_sender_limit.py \
            tests/integration/test_update_robustness_sim.py \
            -m "not stress and not slow" \
            --strict-markers \
            --maxfail=1 \
            --tb=short --durations=30
