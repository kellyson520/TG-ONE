name: Full and Stress

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: full
        type: choice
        options:
          - full
          - stress
          - performance
          - all
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  APP_ENV: testing
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  full:
    name: Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event.inputs.suite == 'full' || github.event.inputs.suite == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full non-stress suite
        run: |
          python -m pytest tests \
            -m "not stress" \
            --strict-markers \
            --tb=short --durations=50

  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event.inputs.suite == 'performance' || github.event.inputs.suite == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run performance tests
        run: |
          python -m pytest tests/performance tests/benchmarks \
            --strict-markers \
            --tb=short --durations=50

  stress:
    name: Stress
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event.inputs.suite == 'stress' || github.event.inputs.suite == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run stress tests
        run: |
          python -m pytest tests/stress \
            -m "stress or slow" \
            --strict-markers \
            --tb=short --durations=50
